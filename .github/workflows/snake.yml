name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:       # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%2315803D&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353&color_background=%23071C26&dark_color_snake=%2315803D&dark_color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353&dark_color_background=%23071C26
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2315803D&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353&color_background=%23071C26&dark_color_snake=%2315803D&dark_color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353&dark_color_bac
